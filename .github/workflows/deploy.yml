name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, mint a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a merge
# can't cancel the deploy of the commit before it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local asset references
        run: ./scripts/check-assets.sh

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp index.html manifesto.html _site/
          cp -R assets _site/assets
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
